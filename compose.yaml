services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: interviewrecall
      MYSQL_USER: interviewrecall
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    volumes:
      - recall-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
volumes:
  recall-db:
